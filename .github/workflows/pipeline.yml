name: Pipeline DevSecOps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/landing-page

jobs:
  build:
    name: 1 - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: landing-page:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar

  sonar:
    name: 2 - Sonar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trivy:
    name: 3 - Trivy
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan do codigo (fs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-codigo.txt
          exit-code: "0"
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - name: Scan da imagem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: /tmp/image.tar
          format: table
          output: trivy-imagem.txt
          exit-code: "0"
      - name: Resumo no job
        run: |
          echo "## Trivy - codigo" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-codigo.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## Trivy - imagem" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-imagem.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: relatorios-trivy
          path: |
            trivy-codigo.txt
            trivy-imagem.txt

  push:
    name: 4 - Push
    needs: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publica no Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

  deploy:
    name: 5 - Deploy (kind)
    needs: push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Aplica manifests
        run: kubectl apply -f k8s/
      - name: Atualiza a imagem
        run: kubectl set image deployment/landing-page landing-page=${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Aguarda rollout
        run: kubectl rollout status deployment/landing-page --timeout=120s
